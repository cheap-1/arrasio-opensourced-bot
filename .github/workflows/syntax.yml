name: Node syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Check JavaScript syntax
        run: |
          node --check server/game/network/sockets.js
          node --check server/game/index.js
          node --check public/client/app.js
